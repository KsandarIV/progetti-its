<style>
/* ============================================================
   ODYSSEY Engine v4 — DESIGN SYSTEM (Storyboard UI/UX Edition)
   Dark/Neon Theme: #0B081A, #00FFFF, #FF8C00
   ============================================================ */

:root {
  --bg-base: #0B081A;
  --bg-surface: #1A153A;
  --bg-surface-glass: rgba(26, 21, 58, 0.95);
  --bg-highlight: #231C4C;
  
  --primary: #FF8C00;
  --primary-hover: #FF5500;
  --secondary: #00FFFF;
  --accent: #00FF66;
  --danger: #FF3333;
  
  --text-main: #FFFFFF;
  --text-muted: #8E8A9F;
  --border-color: #3E3863;
  
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background-color: var(--bg-base);
  color: var(--text-main);
  line-height: 1.5;
  padding-bottom: env(safe-area-inset-bottom);
  user-select: none; /* Previene selezioni accidentali su tap prolungato */
}

::-webkit-scrollbar { width: 0px; background: transparent; }
.hidden { display: none !important; }

/* ================= HEADER & UTILS ================= */
.app-header {
  position: sticky; top: 0; z-index: 50;
  padding: 16px; background: var(--bg-surface-glass);
  border-bottom: 1px solid var(--border-color);
}
.header-content { display: flex; align-items: center; justify-content: space-between; }
.header-content h1 { color: var(--primary); font-size: 14px; font-weight: 800; letter-spacing: 1px; }

.app-main { max-width: 480px; margin: 0 auto; padding: 16px; }

.neon-orange { color: var(--primary); text-shadow: 0 0 5px rgba(255,140,0,0.5); }
.neon-cyan { color: var(--secondary); text-shadow: 0 0 5px rgba(0,255,255,0.5); }
.text-primary { color: var(--primary); }
.border-primary { border-color: var(--primary) !important; }
.border-cyan { border-color: var(--secondary) !important; }
.title-centered { text-align: center; font-size: 16px; font-weight: 800; }
.mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; } .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; }
.w-100 { width: 100%; } .text-center { text-align: center; }

/* Bottoni Base */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 14px; font-size: 14px; font-weight: bold;
  border-radius: var(--radius-lg); border: none; cursor: pointer;
  transition: var(--transition); text-transform: uppercase;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; }
.btn-primary:active { transform: scale(0.98); }
.btn-slim-orange { background: var(--bg-surface); color: var(--primary); border: 1px solid var(--primary); padding: 10px; }
.btn-dataset { background: var(--primary); color: #000; font-weight: 900; text-shadow: 0 0 8px #FFF; }
.btn-outline-cyan { background: transparent; border: 2px solid var(--secondary); color: var(--secondary); }
.btn-outline-orange { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn-icon { background: transparent; border: none; font-size: 20px; font-weight: bold; cursor: pointer; padding: 4px; }

/* ================= SCHERMATA 1: CALENDARIO ================= */
.month-toggle-container { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 24px; }
#current-month-display { font-size: 18px; font-weight: bold; text-transform: uppercase; }

.switch-neon { position: relative; display: inline-block; width: 140px; height: 34px; }
.switch-neon input { opacity: 0; width: 0; height: 0; }
.slider-neon { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-surface); border: 1px solid var(--secondary); border-radius: 34px; transition: .4s; overflow: hidden;}
.slider-neon:before { position: absolute; content: ""; height: 26px; width: 68px; left: 3px; bottom: 3px; background-color: var(--secondary); border-radius: 34px; transition: .4s; }
input:checked + .slider-neon:before { transform: translateX(64px); background-color: var(--accent); border-color: var(--accent);}
.slider-text { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: bold; z-index: 1; }
.slider-text.off { left: 15px; color: var(--text-main); }
.slider-text.on { right: 20px; color: var(--bg-base); }
input:checked + .slider-neon .slider-text.off { color: var(--text-main); }
input:checked + .slider-neon .slider-text.on { color: var(--bg-base); }

/* Griglia Asimmetrica */
.calendar-wrapper { display: flex; justify-content: center; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(21, 1fr); /* 21 colonne per gestire sia 7 che 3 elementi */
  gap: 6px;
  width: 100%;
}

.cal-day {
  grid-column: span 3; /* I giorni normali (1-28) occupano 1/7 dello spazio */
  aspect-ratio: 1;
  background: var(--bg-surface); border: 1px solid var(--secondary); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 14px; color: var(--text-main);
  cursor: pointer; transition: var(--transition);
}

.cal-day:active { background: var(--secondary); color: var(--bg-base); transform: scale(0.95); }

/* Seleziona AUTOMATICAMENTE dal 29esimo giorno in poi, senza toccare l'HTML */
.cal-day:nth-child(n+29) {
  grid-column: span 7; /* I giorni 29, 30 e 31 occupano 1/3 dello spazio */
  aspect-ratio: 7 / 3; /* Mantiene la stessa esatta altezza dei bottoni quadrati */
}

/* ================= SCHERMATA 2: ROUTING ================= */
.routing-header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.date-display { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
.date-subtitle { font-size: 14px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }

.route-card {
  background: var(--bg-surface);
  border: 1px solid var(--secondary);
  border-radius: var(--radius-lg);
  padding: 16px; margin-bottom: 12px;
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: var(--transition);
}
.route-card:active { background: var(--bg-highlight); border-color: var(--primary); }
.rc-title { font-size: 16px; font-weight: bold; color: var(--text-main); }
.rc-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }
.rc-emojis { font-size: 18px; letter-spacing: 4px; }

/* ================= SCHERMATA 3.1: TRACCIAMENTO ================= */
.tratta-banner { background: var(--bg-surface); padding: 12px; border-radius: var(--radius-md); border-left: 4px solid var(--secondary); display: flex; gap: 12px; align-items: center; }
.tratta-progress { background: var(--bg-base); color: var(--secondary); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
.tratta-name { font-weight: bold; font-size: 15px; }

.time-boxes-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.time-box { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 8px; cursor: pointer; transition: var(--transition); }
.time-box.square { aspect-ratio: 1; }
.time-box.rect { width: 100%; padding: 20px 8px; }
.time-box.active { border-color: var(--secondary); background: var(--bg-highlight); }
.time-box.active-primary { border-color: var(--primary); background: rgba(255,140,0,0.1); }
.tb-label { font-size: 10px; font-weight: bold; color: var(--text-muted); margin-bottom: 8px; text-align: center; }
.tb-input { background: transparent; border: none; color: var(--text-main); font-size: 24px; font-weight: bold; text-align: center; width: 100%; pointer-events: none; }
.tb-input.text-primary { color: var(--primary); }

.options-grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt-box { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; cursor: pointer; transition: var(--transition); position: relative; }
.opt-box.square { aspect-ratio: 1; }
.opt-box.active { border-color: var(--secondary); background: var(--bg-highlight); }
.opt-icon { font-size: 24px; margin-bottom: 4px; }
.opt-label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
.opt-val { font-size: 16px; font-weight: bold; color: var(--secondary); margin-top: 4px; text-align: center; }

/* Switch annidato in opt-box */
.mini-switch { margin-top: 6px; }
.switch-small { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch-small input { opacity: 0; width: 0; height: 0; }
.slider-small { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-base); border: 1px solid var(--border-color); border-radius: 20px; transition: .4s; }
.slider-small:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: var(--text-muted); border-radius: 50%; transition: .4s; }
input:checked + .slider-small { border-color: var(--secondary); }
input:checked + .slider-small:before { transform: translateX(20px); background-color: var(--secondary); }

.tratta-nav-footer { display: flex; gap: 8px; }
.btn-nav { flex: 1; }
.btn-nav.prev { background: var(--bg-surface); color: var(--text-muted); }
.btn-nav.next { background: var(--primary); color: white; }
.btn-nav:disabled { opacity: 0.5; pointer-events: none; }

/* ================= POP-UPS & MODALI ================= */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11,8,26,0.85); z-index: 1000; backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.modal-content { background: var(--bg-surface); width: 100%; max-width: 480px; border-top-left-radius: var(--radius-xl); border-top-right-radius: var(--radius-xl); padding: 24px; border-top: 2px solid var(--secondary); display: flex; flex-direction: column; max-height: 90vh; }
.modal-content.center-box { border-radius: var(--radius-xl); border: 2px solid var(--secondary); align-self: center; width: 90%; margin-bottom: 0; }
.modal-content.full-screen { height: 95vh; }

.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.modal-header.sticky { position: sticky; top: 0; background: var(--bg-surface); z-index: 10; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
.btn-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

/* Ruota Oraria (Custom Picker) */
.time-picker-custom { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 20px 0; }
.time-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tp-btn { background: var(--bg-base); border: 1px solid var(--border-color); color: var(--primary); border-radius: 8px; width: 60px; height: 40px; font-size: 20px; cursor: pointer; transition: var(--transition); }
.tp-btn:active { background: var(--primary); color: white; }
.tp-val { font-size: 48px; font-weight: bold; color: var(--text-main); font-variant-numeric: tabular-nums; }
.time-sep { font-size: 48px; font-weight: bold; color: var(--text-muted); margin-bottom: 8px; }

/* Mese Slider */
.month-slider-container { margin: 30px 0; }
input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--secondary); cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px var(--secondary); }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: var(--border-color); border-radius: 4px; }
.month-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-muted); font-weight: bold; }

/* Array Trackers & Griglie Modal */
.array-tracker { font-size: 12px; color: var(--secondary); background: var(--bg-base); padding: 8px 12px; border-radius: var(--radius-sm); border: 1px dashed var(--secondary); min-height: 36px; word-break: break-word; }
.sticky-tracker { position: sticky; top: 52px; z-index: 9; }
.sticky-bottom { position: sticky; bottom: 0; z-index: 10; margin-top: auto; }

.btn-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mood-grid-large { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; padding-bottom: 16px; }

.opt-btn-large { background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius-md); padding: 16px 0; font-size: 16px; font-weight: bold; cursor: pointer; transition: var(--transition); }
.opt-btn-large.active { background: var(--secondary); color: var(--bg-base); border-color: var(--secondary); }

/* Animazioni e Utils */
.fade-in { animation: fadeIn 0.3s ease-out forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
.toast { background: var(--bg-surface); border: 1px solid var(--border-color); color: white; padding: 16px; border-radius: var(--radius-md); box-shadow: 0 4px 15px rgba(0,0,0,0.8); font-weight: bold; font-size: 13px; animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: auto; }
.toast.success { border-left: 4px solid var(--accent); }
.toast.error { border-left: 4px solid var(--danger); }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11,8,26,0.9); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.spinner { width: 40px; height: 40px; border: 4px solid var(--border-color); border-left-color: var(--secondary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
@keyframes spin { 100% { transform: rotate(360deg); } }

.status-indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-indicator.online { background-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status-indicator.offline { background-color: var(--primary); box-shadow: 0 0 8px var(--primary); }

  /* ================= RUOTA ORARIA VERA (Wheel Picker) ================= */
  .wheel-frame { position: relative; height: 220px; margin: 20px 0; }
  .wheel-picker { display: flex; gap: 16px; justify-content: center; align-items: center;
                  height: 220px; position: relative; z-index: 1; }
  .wheel-col { width: 90px; height: 220px; overflow: hidden; position: relative;
               background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 16px;
               touch-action: none; -webkit-overflow-scrolling: touch; user-select: none; }
  .wheel-col.highlight { border-color: var(--secondary); box-shadow: 0 0 16px rgba(0,255,255,0.35); }
  .wheel-strip { display: flex; flex-direction: column; align-items: center; padding: 0;
                 will-change: transform; }
  .wheel-item { height: 44px; width: 90px; display: flex; align-items: center; justify-content: center;
                font-size: 22px; font-weight: bold; color: var(--text-muted); cursor: pointer;
                flex-shrink: 0; transition: color 0.15s, font-size 0.15s, text-shadow 0.15s; }
  .wheel-item.active { color: var(--secondary); font-size: 30px; text-shadow: 0 0 12px var(--secondary); }
  .wheel-sep { font-size: 38px; color: var(--primary); font-weight: bold; }
  .wheel-indicator { position: absolute; left: 8%; right: 8%; top: 88px; height: 44px;
                     background: rgba(0,255,255,0.10); border-top: 1px solid var(--secondary);
                     border-bottom: 1px solid var(--secondary); pointer-events: none; z-index: 2;
                     border-radius: 6px; }
  .wheel-fade { position: absolute; left: 0; right: 0; height: 88px; pointer-events: none; z-index: 3; }
  .wheel-fade.top { top: 0; background: linear-gradient(to bottom, var(--bg-base), transparent); }
  .wheel-fade.bottom { bottom: 0; background: linear-gradient(to top, var(--bg-base), transparent); }
  .wheel-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  /* ================= ROUTE BADGE & PERCORSO CARD ================= */
  .route-card {
    background: var(--bg-surface);
    border: 1px solid var(--secondary);
    border-radius: var(--radius-lg);
    padding: 16px; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 6px;
    cursor: pointer; transition: var(--transition);
  }
  .route-card:active { background: var(--bg-highlight); border-color: var(--primary); transform: scale(0.98); }
  .route-card.disabled { opacity: 0.6; cursor: not-allowed; }
  /* Nuovo layout bottone percorso: titolo grande + badge + emote */
  .rc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rc-title { font-size: 20px; font-weight: 900; color: var(--text-main); letter-spacing: 0.8px; text-transform: uppercase; }
  .rc-tratte-badge { background: var(--bg-base); color: var(--primary); border: 1px solid var(--primary); padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
  .rc-emojis { font-size: 28px; letter-spacing: 4px; line-height: 1.2; padding: 4px 0; word-break: break-word; }
  .rc-tratta-emojis { font-size: 20px; letter-spacing: 4px; }
  /* legacy (retro-compat) */
  .rc-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
  .rc-tratte { background: var(--bg-base); color: var(--secondary); padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }

  /* ================= WIP POPUP ================= */
  .wip-box { text-align: center; padding: 32px 16px; }
  .wip-emoji { font-size: 48px; margin-bottom: 16px; }
  .wip-title { font-size: 18px; color: var(--secondary); font-weight: bold; margin-bottom: 8px; }
  .wip-text { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }

</style>
